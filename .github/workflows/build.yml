name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      NISH_ICONS_QUIET: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.11"

      - name: Decide whether to publish a release
        id: rel
        shell: bash
        run: |
          V="v$(tr -d '[:space:]' < VERSION)"
          PUBLISH=false
          if [[ "$GITHUB_REF" == "refs/heads/main" ]] && ! gh release view "$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            PUBLISH=true
            echo "New version $V - will publish a release if everything passes."
          fi
          echo "tag=$V" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Tests (icons, desktop.ini, shortcuts, menu layout, favourites)
        timeout-minutes: 5
        run: python tests/test_core.py

      - name: Build exe
        timeout-minutes: 10
        run: pyinstaller NiSHIcons.spec --noconfirm

      - name: Right-click commands test (the exe changes a folder and a shortcut, then resets them)
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Resolve-Path dist\NiSHIcons.exe).Path
          $d = Join-Path $env:RUNNER_TEMP "cli test"
          New-Item -ItemType Directory -Force (Join-Path $d "My Folder") | Out-Null
          $icon = Join-Path $d "test.ico"
          python -c "import sys; sys.path.insert(0, '.'); import app; app._test_icon(sys.argv[1], (200, 50, 50))" $icon
          function Run([string]$argsLine) {
            $p = Start-Process -FilePath $exe -ArgumentList $argsLine -PassThru -Wait
            if ($p.ExitCode -ne 0) { throw "NiSHIcons.exe $argsLine exited with $($p.ExitCode)" }
          }
          $folder = Join-Path $d "My Folder"
          Run "--apply `"$icon`" `"$folder`""
          $ini = Get-Item (Join-Path $folder "desktop.ini") -Force
          $text = Get-Content $ini.FullName -Raw
          if ($text -notlike "*IconResource=$icon,0*") { throw "desktop.ini does not point at the icon:`n$text" }
          if (-not ($ini.Attributes -band [IO.FileAttributes]::Hidden) -or -not ($ini.Attributes -band [IO.FileAttributes]::System)) { throw "desktop.ini should be hidden + system, is $($ini.Attributes)" }
          $fa = (Get-Item $folder -Force).Attributes
          if (-not (($fa -band [IO.FileAttributes]::ReadOnly) -or ($fa -band [IO.FileAttributes]::System))) { throw "folder is not marked for desktop.ini: $fa" }
          "ok   folder icon set ($fa)"

          $ws = New-Object -ComObject WScript.Shell
          $lnkPath = Join-Path $d "Notepad.lnk"
          $lnk = $ws.CreateShortcut($lnkPath); $lnk.TargetPath = "$env:WINDIR\notepad.exe"; $lnk.Arguments = "--test"; $lnk.Save()
          Run "--apply `"$icon`" `"$lnkPath`""
          $check = $ws.CreateShortcut($lnkPath)
          if ($check.IconLocation -ne "$icon,0") { throw "shortcut icon is '$($check.IconLocation)'" }
          if ($check.TargetPath -notlike "*notepad.exe" -or $check.Arguments -ne "--test") { throw "shortcut target changed: $($check.TargetPath) $($check.Arguments)" }
          "ok   shortcut icon set and Windows reads it: $($check.IconLocation)"

          Run "--reset `"$folder`""
          if (Test-Path (Join-Path $folder "desktop.ini")) { throw "desktop.ini still there after reset" }
          Run "--reset `"$lnkPath`""
          $after = $ws.CreateShortcut($lnkPath).IconLocation
          if ($after -ne ",0") { throw "shortcut still has an icon after reset: $after" }
          "ok   reset folder and shortcut"

      - name: GUI smoke test (opens the window, clicks through everything, writes the right-click menu)
        timeout-minutes: 8
        shell: pwsh
        run: |
          $out = Join-Path $PWD "gui-smoke"
          $p = Start-Process -FilePath "dist\NiSHIcons.exe" -ArgumentList "--smoketest", "`"$out`"" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); $timedOut = $true }
          $report = ""
          if (Test-Path "$out\gui_smoketest.txt") { $report = Get-Content "$out\gui_smoketest.txt" -Raw }
          Write-Output $report
          if ($timedOut -or $p.ExitCode -ne 0 -or $report -notmatch "GUI SMOKETEST PASSED") {
            $msg = ("timedOut=$timedOut exit=$($p.ExitCode)`n" + $report) -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'
            Write-Output "::error title=gui-smoketest::$msg"
            throw "GUI smoke test failed"
          }
          $short = (($report -replace "`r", "" -split "`n") | Where-Object { $_ -match "^ok" }) -join "%0A"
          Write-Output "::notice title=gui-smoketest::$short"
          "{0:N1} MB" -f ((Get-Item dist\NiSHIcons.exe).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: NiSHIcons-windows
          path: dist/NiSHIcons.exe
          retention-days: 14

      - name: Publish release
        if: steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: NiSH Icons ${{ steps.rel.outputs.tag }}
          body: "Download **NiSHIcons.exe** below and double-click it. No installer, no admin rights."
          make_latest: true
          files: dist/NiSHIcons.exe
